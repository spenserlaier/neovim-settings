[custom.jj]
when = "jj-starship detect"
command = '''
width=${COLUMNS:-$(tput cols 2>/dev/null || printf 80)}
jj-starship | awk -v width="$width" '
  function visible_length(text) {
    gsub(/\033\[[0-9;]*m/, "", text)
    return length(text)
  }
  {
    count = split($0, parts, ", ")
    line = parts[1]
    for (i = 2; i <= count; i++) {
      if (visible_length(line) + 2 + visible_length(parts[i]) > width) {
        print line ","
        line = parts[i]
      } else {
        line = line ", " parts[i]
      }
    }
    print line
  }
'
'''
shell = ["sh"]
format = " $output "

[git_branch]
