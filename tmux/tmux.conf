# Shared configuration. The -F flag expands the current file's directory so
# this also works when the repository is cloned in a different location.
source-file -F "#{d:current_file}/common.conf"

# Legacy TPM support. Home Manager consumes common.conf directly and manages
# these plugins as pinned Nix packages instead.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
