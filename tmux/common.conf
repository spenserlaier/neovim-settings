# --- Prefix: Ctrl-a (Best for Vim users) ---
unbind C-b
unbind C-w
set -g prefix C-a
bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi Y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi v send -X begin-selection
set -g set-clipboard on
bind C-a send-prefix

# --- Smart Pane Switching (Vim + Tmux Integration) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# --- Pane Resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Splits ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# --- Copy Mode & Mouse ---
setw -g mode-keys vi
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane

# --- OS-Agnostic Clipboard Setup ---
if-shell 'uname -s | grep -q Darwin' 'set -s copy-command "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ]' 'set -s copy-command "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip > /dev/null' 'set -s copy-command "xclip -in -selection clipboard"'

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-pipe

# Find an existing session; Shift-F opens the directory picker to create one.
bind-key -r f display-popup -E -w 90% -h 90% "~/.config/fish/tmux-sessionizer.fish --sessions"
bind-key -r F display-popup -E -w 80% -h 80% "~/.config/fish/tmux-sessionizer.fish"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux Reloaded!"
bind , command-prompt -I "#W" "rename-window '%%'"

# FZF window switcher constrained to the current session
bind g display-popup -E -w 90% -h 90% "fish ~/.config/fish/tmux-picker.fish --windows"
bind Space run-shell 'fish ~/.config/fish/tmux-window-hints.fish start #{q:session_id} #{q:client_name}'
bind -T window-jump Escape run-shell 'fish ~/.config/fish/tmux-window-hints.fish cancel #{q:session_id} #{q:client_name} #{q:@jump_token}'
bind -T window-jump Any run-shell 'fish ~/.config/fish/tmux-window-hints.fish cancel #{q:session_id} #{q:client_name} #{q:@jump_token}'
bind -T window-jump o run-shell 'fish ~/.config/fish/tmux-window-hints.fish picker #{q:session_id} #{q:client_name} #{q:@jump_token}'
run-shell 'fish ~/.config/fish/tmux-window-hints.fish bind'
bind -r n next-window
bind -r p previous-window

# The status bar uses a neutral background so the shared window accents stand out.
set -g status 2
set -g status-style 'fg=#cdd6f4,bg=#313244'
set -g status-left '#{?#{m/r:^[0-9]+$,#{session_name}},,[#{session_name}] }'
set -g status-right ''
# All window rows use two leading cells and eighteen cells of text per window.
set -g window-status-format '#[fg=#{@window_accent}]●#[default] #{s!(#)!\1\1!:#{p18:#{=/16/…:#{window_index}:#{window_name}}}}'
set -g window-status-current-format '#[fg=#{@window_accent},bold]● #{s!(#)!\1\1!:#{p18:#{=/16/…:#{window_index}:#{window_name}}*}}#[default]'

# Remove identical paths before looking for another directory with the same basename.
set -g @status_folder_pattern '#{s!([^a-zA-Z0-9_-])!\\\1!:#{b:pane_current_path}}'
set -g @status_path_pattern '#{s!([^a-zA-Z0-9_/-])!\\\1!:pane_current_path}'
set -g @status_other_paths '#{s!/#{E:@status_path_pattern}//!!:#{W:/#{pane_current_path}//}}'
set -g @status_folder_duplicate '#{m/r:/#{E:@status_folder_pattern}//,#{E:@status_other_paths}}'

# Reserve space for the folder and slash, then fit the parent in the remaining cells.
set -g @status_duplicate_leaf '#{=/14/…:#{b:pane_current_path}}'
set -g @status_qualified_folder '#{=/#{e|-:17,#{w:#{E:@status_duplicate_leaf}}}:#{s!^.*/!!:#{d:pane_current_path}}}/#{E:@status_duplicate_leaf}'
set -g @status_folder '#{?pane_current_path,#{?#{==:#{pane_current_path},/},/,#{?#{E:@status_folder_duplicate},#{E:@status_qualified_folder},#{=/17/…:#{b:pane_current_path}}}},}'
set -g @status_folder_cell '  #{s!(#)!\1\1!:#{p18:#{E:@status_folder}}}'

# Mirror the main row's side widths and scroll focus on each lower row.
set -g @status_window_list_start '#[align=left]#{R: ,#{w:#{T;=/#{status-left-length}:status-left}}}#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]'
set -g @status_window_list_end '#[nolist align=right]#{R: ,#{w:#{T;=/#{status-right-length}:status-right}}}'
set -g @status_jumping '#{==:#{client_key_table},window-jump}'
set -g 'status-format[1]' '#{?#{E:@status_jumping},#[bg=#45475a#,fill=#45475a]#[push-default],}#{E:@status_window_list_start}'
set -ga 'status-format[1]' '#{W:#[range=window|#{window_index} fg=#a6adc8]#{E:@status_folder_cell}#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus]#{E:@status_folder_cell}#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}'
set -ga 'status-format[1]' '#{E:@status_window_list_end}'

# The jump row uses the same window IDs as the key bindings, even if indices change.
set -g @status_jump_key '#{?#{m/r: #{window_id}/[a-z] ,#{@jump_targets}},[#{s!^.* #{window_id}/([a-z]) .*$!\1!:@jump_targets}],}'
# Keep showing labels saved by the older recorder until the next command finishes.
set -g @status_jump_label '#{?@last_shell_command,#{@last_shell_command},#{@last_shell_fallback}}'
set -g @status_jump_command '#{?#{&&:#{m/r: #{window_id} ,#{@jump_command_windows}},#{E:@status_jump_label}}, #{=/13/…:#{E:@status_jump_label}},}'
set -g @status_jump_cell '  #{p18:#{E:@status_jump_key}#{E:@status_jump_command}}'
set -g @status_jump_row '#{E:@status_window_list_start}'
set -ga @status_jump_row '#{W:#[fg=#{@window_accent} bold]#{E:@status_jump_cell}#[default]#{?loop_last_flag,,#{E:window-status-separator}},#[list=focus fg=#{@window_accent} bold]#{E:@status_jump_cell}#[list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}'
set -ga @status_jump_row '#{E:@status_window_list_end}'
set -g 'status-format[2]' '#{?#{E:@status_jumping},#{E:@status_jump_row},}'

set-hook -g after-new-session 'run-shell "fish ~/.config/fish/tmux-window-colors.fish"'
set-hook -g after-new-window 'run-shell "fish ~/.config/fish/tmux-window-colors.fish"'
set-hook -g client-detached 'run-shell "fish ~/.config/fish/tmux-window-hints.fish cleanup"'
set-hook -g client-session-changed 'run-shell "fish ~/.config/fish/tmux-window-hints.fish cleanup"'
run-shell 'fish ~/.config/fish/tmux-window-hints.fish cleanup'
run-shell 'fish ~/.config/fish/tmux-window-colors.fish'

# Settings for the Home Manager-managed Resurrect and Continuum plugins.
set -g @resurrect-processes 'nvim "~python manage.py runserver"'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
