# --- Prefix: Ctrl-a (Best for Vim users) ---
unbind C-b
unbind C-w
set -g prefix C-a
bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi Y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi v send -X begin-selection
set -g set-clipboard on
bind C-a send-prefix

# --- Smart Pane Switching (Vim + Tmux Integration) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# --- Pane Resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Splits ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# --- Copy Mode & Mouse ---
setw -g mode-keys vi
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane

# --- OS-Agnostic Clipboard Setup ---
if-shell 'uname -s | grep -q Darwin' 'set -s copy-command "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ]' 'set -s copy-command "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip > /dev/null' 'set -s copy-command "xclip -in -selection clipboard"'

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-pipe

bind-key -r f display-popup -E -w 80% -h 80% "~/.config/fish/tmux-sessionizer.fish"
bind r if-shell 'test -f ~/.config/tmux/tmux.conf' \
    'source-file ~/.config/tmux/tmux.conf' \
    'source-file ~/.tmux.conf' \; \
    display-message "Tmux Reloaded!"
bind , command-prompt -I "#W" "rename-window '%%'"

# FZF window switcher constrained to the current session
bind g display-popup -E "tmux list-windows -t '' -F '#{window_index}: #{window_name}' | fzf --reverse | cut -d: -f1 | xargs tmux select-window -t"

# Plugin settings shared by TPM and Home Manager-managed plugins.
set -g @resurrect-processes 'nvim "~python manage.py runserver"'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
